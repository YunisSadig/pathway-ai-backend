server:
  port: ${PORT:8080}   # hosting platforms inject PORT
  servlet:
    session:
      timeout: 7d                 # idle timeout; app.account.absolute-session-age caps the total life
      cookie:
        name: PATHWAY_SESSION
        http-only: true           # JavaScript can never read the session cookie
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # true in the prod profile

spring:
  application:
    name: pathway-ai-backend
  # Optional local .env file (KEY=VALUE lines, git-ignored). Real environment variables win.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pathway_ai}
    username: ${DB_USERNAME:pathway}
    password: ${DB_PASSWORD}
  session:
    jdbc:
      initialize-schema: never    # Flyway (V9) owns the tables
      cleanup-cron: "0 */10 * * * *"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only verifies the mapping
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  access:
    # false: the academic catalogue needs a signed-in account with catalogue_access (protected beta, Studyinfo terms unresolved)
    catalogue-public: ${CATALOGUE_PUBLIC:false}
  account:
    site-url: ${SITE_URL:http://localhost:3000}
    registration-open: ${REGISTRATION_OPEN:true}
    mail-from: ${MAIL_FROM:no-reply@pathway-ai.invalid}
    # Email is sent only when an SMTP server is configured with SPRING_MAIL_HOST (+ _PORT, _USERNAME, _PASSWORD); otherwise the API
    # reports emailDeliveryAvailable=false and the website hides verification and reset.
  google:
    # Continue with Google is offered only when BOTH are set (hosted secrets; never committed). Redirect URI: ${SITE_URL}/api/v1/account/oauth/google/callback
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  cors:
    # Explicit origins only (comma separated). Set CORS_ALLOWED_ORIGINS to the deployed frontend origin in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  reference-data:
    # Off by default. Set IMPORT_REFERENCE_DATA=true to run the idempotent source-cited import at startup.
    import-on-startup: ${IMPORT_REFERENCE_DATA:false}
    location: ${REFERENCE_DATA_LOCATION:classpath:reference-data/taxonomy.json}
    # Static programs/universities/sources are refused at startup unless this is set deliberately (see ReferenceDataImportRunner).
    allow-static-records: ${ALLOW_STATIC_REFERENCE_RECORDS:false}

  refresh:
    # Hosts the crawler may contact besides those of registered sources. opintopolku.fi is the Studyinfo official API
    # (its robots.txt asks for a 30 second crawl delay, which the fetcher honours).
    extra-approved-hosts: ${REFRESH_EXTRA_APPROVED_HOSTS:opintopolku.fi}

  catalogue:
    # Off by default. Set IMPORT_UNIVERSITY_CATALOGUE=true to run the idempotent institution import at startup.
    import-on-startup: ${IMPORT_UNIVERSITY_CATALOGUE:false}
    location: ${UNIVERSITY_CATALOGUE_LOCATION:classpath:reference-data/universities.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
