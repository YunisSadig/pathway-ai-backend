server:
  port: ${PORT:8080}   # hosting platforms inject PORT

spring:
  application:
    name: pathway-ai-backend
  # Optional local .env file (KEY=VALUE lines, git-ignored). Real environment variables win.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pathway_ai}
    username: ${DB_USERNAME:pathway}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only verifies the mapping
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Explicit origins only (comma separated). Set CORS_ALLOWED_ORIGINS to the deployed frontend origin in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  reference-data:
    # Off by default. Set IMPORT_REFERENCE_DATA=true to run the idempotent source-cited import at startup.
    import-on-startup: ${IMPORT_REFERENCE_DATA:false}
    location: ${REFERENCE_DATA_LOCATION:classpath:reference-data/programs.json}

  catalogue:
    # Off by default. Set IMPORT_UNIVERSITY_CATALOGUE=true to run the idempotent institution import at startup.
    import-on-startup: ${IMPORT_UNIVERSITY_CATALOGUE:false}
    location: ${UNIVERSITY_CATALOGUE_LOCATION:classpath:reference-data/universities.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
