# Tests exercise the API with synthetic rows that have no source monitor, so the public-discovery restriction
# (verified + recently refreshed) is switched off here. DiscoveryVisibilityIT turns it on explicitly.
app.discovery.restrict-to-verified-fresh=false
app.curated.enabled=false

# Student accounts (V9): the catalogue tests exercise the API without a login, so the catalogue is open here; the gate has its own
# integration tests (CatalogueGateIT sets it back to false). A cheap password hash keeps the account tests fast.
app.access.catalogue-public=true
app.account.bcrypt-cost=4
# every distinct test configuration keeps its own Spring context (and pool) alive; small pools keep the shared test database under its
# connection limit
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
