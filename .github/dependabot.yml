# Weekly dependency and workflow-action update PRs. Each PR runs the normal CI (tests, ITs, container-free build) before it can be merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # the runtime is Java 21 on purpose; a JVM upgrade is a deliberate change, not a weekly bump
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
