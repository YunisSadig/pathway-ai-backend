name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # fail the build if the executable bit is lost in git (the hosted refresh workflow runs ./mvnw without a chmod of its own)
      - name: Executable bits are committed
        run: bash scripts/ci/check-exec-bits.sh

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # the unattended-sync script's safety guards (TLS verification, no localhost on a hosted runner, importers off, masking)
      - name: Scheduler script guards
        run: bash scripts/ci/test-run-refresh.sh

      # verify = compile + unit tests (surefire) + package + integration tests (failsafe, Testcontainers PostgreSQL;
      # Docker is preinstalled on ubuntu-latest). No secrets are needed: tests create their own database.
      - name: Build and test
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
