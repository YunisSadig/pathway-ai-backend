# Post-deployment verification of the hosted API. The deployment itself is done by the hosting platform (Render Blueprint render.yaml,
# autoDeployTrigger: checksPass = only after this repository's CI passed). This workflow proves the deploy: it waits until the live service
# reports the merged commit, then smoke-tests it. A failed CI run never reaches this workflow (only conclusion == success continues).
#
# It does nothing until the owner sets the repository VARIABLE API_BASE_URL (the https origin of the deployed API) and the environment
# "staging" holds the secret STAGING_ACCESS_KEY (docs/deployment-api.md).
name: Verify deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-deployment
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ vars.API_BASE_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the merged commit to be live, then smoke-test
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          STAGING_ACCESS_KEY: ${{ secrets.STAGING_ACCESS_KEY }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/ci/verify-deployment.sh
