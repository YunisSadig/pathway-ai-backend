# Unattended synchronization: keeps the official-API programs current while nobody's computer is on.
#
# It does NOTHING until the owner opts in. The job only runs when the repository VARIABLE SYNC_ENABLED is "true" and the three
# repository SECRETS below exist; until then every scheduled run is skipped (no cost, no database access).
# The exact owner steps (account sign-up, secrets, first run) are in docs/deployment-sync.md.
#
# What runs (all in scripts/ci/run-refresh.sh, the same file you can run on a laptop):
#   * daily 05:17 UTC  : `run`  = re-read every source that is due (each program is due weekly, daily inside an application window)
#   * Mondays          : `sync` = discover new programs for the three reviewed universities, then `run`
#   * every run        : `freshness` = last-success watchdog; fails unless EVERY extractor-maintained program was read within 10 days
# Retries: each step is attempted 3 times with growing pauses (database cold start, network blips); a single flaky source never
# fails the job (it is marked FAILING and shows in the report); the job fails when more than half of the checks fail or the
# watchdog finds a program that is no longer current.
# Alerts: a failed run opens (or comments on) a GitHub issue, calls ALERT_WEBHOOK_URL if that secret exists, and GitHub emails the
# user who last edited the cron line (documented GitHub behaviour for scheduled workflows).
#
# Limits that matter (checked against GitHub's documentation on 2026-11-14): scheduled workflows run only on the default branch, can be
# delayed under load, and in a PUBLIC repository are disabled automatically after 60 days without repository activity (any push or
# merge resets the clock; re-enable under Actions if it ever happens). Free for public repositories on standard runners.
name: Source refresh

on:
  schedule:
    - cron: "17 5 * * *"   # daily, off the hour on purpose (GitHub delays :00 runs under load)
  workflow_dispatch:
    inputs:
      mode:
        description: "run | sync | force (re-read all Studyinfo programs now) | bootstrap (first run on an empty database) | freshness"
        type: choice
        options: [run, sync, force, bootstrap, freshness]
        default: run

permissions:
  contents: read
  issues: write

concurrency:
  group: source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -q package -DskipTests

      - name: Choose the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then m="$INPUT_MODE"
          elif [ "$(date -u +%u)" = "1" ]; then m=sync
          else m=run; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"

      - name: Synchronize
        id: refresh
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: bash scripts/ci/run-refresh.sh "$MODE"

      - name: Last-success watchdog
        id: freshness
        if: ${{ steps.mode.outputs.mode != 'bootstrap' }}
        continue-on-error: true
        run: bash scripts/ci/run-refresh.sh freshness

      - name: Alert
        if: ${{ steps.refresh.outcome == 'failure' || steps.freshness.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
        run: |
          title="Source synchronization needs attention"
          body="Synchronization step: ${REFRESH_OUTCOME}; last-success watchdog: ${FRESHNESS_OUTCOME}. Run: ${RUN_URL}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"text\":\"$title. $RUN_URL\"}" "$ALERT_WEBHOOK_URL" || true
          fi

      - name: Fail the job when a step failed
        if: ${{ steps.refresh.outcome == 'failure' || steps.freshness.outcome == 'failure' }}
        run: exit 1
