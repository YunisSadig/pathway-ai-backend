# TEMPLATE for unattended source monitoring. It does nothing until you opt in:
#   - it only runs when started by hand (workflow_dispatch);
#   - the daily schedule below is commented out on purpose.
#
# To enable (needs your approval and a hosted PostgreSQL that this runner can reach; none is provisioned here):
#   1. Add repository secrets DB_URL, DB_USERNAME, DB_PASSWORD for the hosted database.
#   2. Uncomment the `schedule` block.
# See docs/data/automated-refresh.md. The job is safe to run twice or late: due-ness is stored in the database.
name: Source refresh

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 5 * * *"   # daily, 05:17 UTC (off the hour on purpose)

permissions:
  contents: read

concurrency:
  group: source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -q package -DskipTests
      - name: Check every source that is due
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: >
          java -jar target/pathway-ai-backend-0.0.1-SNAPSHOT.jar
          --spring.main.web-application-type=none
          --app.refresh.command=run
      - name: Report
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: >
          java -jar target/pathway-ai-backend-0.0.1-SNAPSHOT.jar
          --spring.main.web-application-type=none
          --app.refresh.command=report
